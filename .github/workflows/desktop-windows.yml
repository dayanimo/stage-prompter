name: Build Windows desktop app

# Builds the .exe installer on a real Windows machine (you can't build a Windows
# installer on macOS). Run it manually from the Actions tab ("Run workflow"), or
# push a version tag (vX.Y.Z) to also publish a GitHub Release with the installer.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allows attaching the installer to a Release on tag builds

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Package the Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer (download from this run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: stage-prompter-windows-setup
          path: release/*Setup*.exe
          if-no-files-found: error

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*Setup*.exe
